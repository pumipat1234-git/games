<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eldoria: The Last Bastion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#05050c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Cinzel,Georgia,serif}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game canvas{display:block;outline:none;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#d4a84a;
  background:#05050c;font-size:22px;letter-spacing:3px;z-index:5;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:#05050c;color:#d4a84a;
  align-items:center;justify-content:center;text-align:center;font-size:22px}
#rotate div{font-size:20px;line-height:1.8}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div>↻<br>Rotate your device to landscape</div></div>
<div id="boot">Loading Eldoria…</div>

<script src="phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
